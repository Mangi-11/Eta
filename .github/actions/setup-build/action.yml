name: 配置 Eta 构建环境
description: 安装 JDK、Gradle 与 Android SDK，供 PR Check 和 Eta Build 共用

runs:
  using: composite
  steps:
    - name: 配置 JDK 25
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
      with:
        distribution: temurin
        java-version: "25"

    # setup-gradle 默认执行 Gradle Wrapper 校验，无需单独的校验步骤
    - name: 配置 Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      with:
        cache-provider: basic

    - name: 配置 Android SDK 工具
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: ""
        log-accepted-android-sdk-licenses: false

    - name: 安装 Android SDK 37
      shell: bash
      run: sdkmanager --channel=3 "platforms;android-37.0"
