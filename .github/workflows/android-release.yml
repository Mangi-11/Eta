name: Eta Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apks:
    name: 构建 Debug 与 Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      # 必须在检出之后运行：空 workspace 下找不到 gradle-wrapper.jar，
      # 验证会直接通过而失去供应链保护作用。
      - name: 校验 Gradle Wrapper
        uses: gradle/wrapper-validation-action@f9c9c575b8b21b6485636a91ffecd10e558c62f6 # v3

      - name: 配置 JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: 配置 Android SDK（稳定通道）
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          # NDK 版本与 gradle/libs.versions.toml 的 ndk 对齐；
          # build-tools 用 AGP 9.4.1 默认的 36.0.0，避免隐式漂移。
          packages: "platform-tools build-tools;36.0.0 ndk;30.0.16248370"

      - name: 安装 Android SDK 37（canary 通道）
        # compileSdk = 37 目前只在 canary 通道提供，与 pr-check.yml 同源；
        # 待 37 进入 stable 后可合并回上一步的 packages 并删除本步。
        # 先接受全部 SDK 许可，避免 canary 包因缺许可而挂起或失败。
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0"

      - name: 输出环境版本
        run: |
          java --version
          ./gradlew --version

      - name: 还原发布证书
        env:
          ETA_RELEASE_KEYSTORE_BASE64: ${{ secrets.ETA_RELEASE_KEYSTORE_BASE64 }}
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ETA_RELEASE_KEYSTORE_BASE64" ||
                -z "$ETA_RELEASE_STORE_PASSWORD" ||
                -z "$ETA_RELEASE_KEY_ALIAS" ||
                -z "$ETA_RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::缺少 Release 签名 Secrets，请检查仓库的 Actions Secrets。"
            exit 1
          fi
          printf '%s' "$ETA_RELEASE_KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/eta-release.jks"
          chmod 600 "$RUNNER_TEMP/eta-release.jks"

      # --no-configuration-cache 是刻意 workaround：gradle/actions v6 移除了
      # configuration-cache 的实验性支持，而 gradle.properties 本地仍开启，
      # CI 显式关闭以避免缓存不命中导致误红。待上游恢复支持后再移除。
      - name: 构建 Debug 与 Release APK
        env:
          ETA_RELEASE_STORE_FILE: ${{ runner.temp }}/eta-release.jks
          ETA_RELEASE_STORE_PASSWORD: ${{ secrets.ETA_RELEASE_STORE_PASSWORD }}
          ETA_RELEASE_KEY_ALIAS: ${{ secrets.ETA_RELEASE_KEY_ALIAS }}
          ETA_RELEASE_KEY_PASSWORD: ${{ secrets.ETA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :app:assembleDebug :app:assembleRelease

      - name: 验证并整理 APK
        id: apk
        run: |
          set -euo pipefail
          debug_apk="app/build/outputs/apk/debug/app-debug.apk"
          release_apk="app/build/outputs/apk/release/app-release.apk"
          output_dir="$RUNNER_TEMP/apks"
          # find 失败时不直接退出，走到下面的友好报错而非原始 find 错误。
          apksigner_path="$(find "${ANDROID_HOME:-}/build-tools" \
            -type f -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"

          if [[ ! -f "$debug_apk" ]]; then
            echo "::error::未找到 Debug APK。"
            exit 1
          fi
          if [[ ! -f "$release_apk" ]]; then
            echo "::error::未找到 Release APK。"
            exit 1
          fi
          if [[ -z "$apksigner_path" ]]; then
            echo "::error::未找到 apksigner。"
            exit 1
          fi

          "$apksigner_path" verify "$release_apk"
          mkdir -p "$output_dir"
          cp "$debug_apk" "$output_dir/app-debug.apk"
          cp "$release_apk" "$output_dir/app-release.apk"
          echo "debug_path=$output_dir/app-debug.apk" >> "$GITHUB_OUTPUT"
          echo "release_path=$output_dir/app-release.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-debug-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.debug_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: 上传 Release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-apk-${{ github.sha }}
          path: ${{ steps.apk.outputs.release_path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14
